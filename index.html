<style>

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:600;line-height:1.1;margin:0}
h1{font-size:2rem}h2{font-size:1.4rem}h3{font-size:1.3rem}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--basil);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.875rem}

.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 1.1rem;background:var(--basil-d);color:#fff}
.brand{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:700}
.brand span{font-weight:500;font-size:1rem;opacity:.75;margin-left:.6rem}
.who{display:flex;align-items:center;gap:.9rem;font-size:.95rem}
.top .link{color:#fff}
.tabs{display:flex;gap:.2rem;overflow-x:auto;padding:0 .8rem;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;padding:.8rem .8rem .6rem;font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--basil)}
main{max-width:980px;margin:0 auto;padding:1.2rem 1rem 2rem}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.5rem 1.1rem;border:1.5px solid var(--line);background:var(--card);border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--basil);border-color:var(--basil);color:#fff}
.btn.danger{color:var(--tom);border-color:var(--tom-s)}
.btn.big{min-height:56px;font-size:1.1rem;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--basil);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.back{margin-bottom:.9rem}
.loading,.empty{padding:2rem 0;color:var(--muted)}

.login{max-width:420px;margin:12vh auto;padding:0 1.2rem}
.login h1{font-size:3.2rem;color:var(--basil-d)}
.login p{margin:.2rem 0 1.6rem;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:.3rem;font-size:.9rem;color:var(--muted);margin-bottom:1rem}
.fld input,.fld select,.sel,.search,.uform input{min-height:48px;padding:.5rem .75rem;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:1rem;width:100%}
.fld.inline{flex-direction:row;align-items:center;margin:0}.fld.inline input{width:auto}
.sel{width:auto}
.err{color:var(--tom);min-height:1.4em}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1rem;margin-bottom:1rem}
.vhead h1{margin-right:auto}

.conta-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1rem}
.conta-head .fld{margin:0;flex:0 1 320px;min-width:240px}
.rail{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -1rem;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.55rem;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:6px;padding:.3rem .65rem;font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:600;cursor:pointer}
.chip b{font-family:'Atkinson Hyperlegible',sans-serif;font-size:.78rem;font-weight:400;color:var(--muted);margin-left:.3rem}
.chip.full{background:var(--basil-s);border-color:var(--basil)}
.chip.cur{border-color:var(--ink,#1d2a22);box-shadow:inset 0 -3px 0 var(--ink,#1d2a22)}

.sez{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:1rem;scroll-margin-top:135px;overflow:hidden}
.sez h2{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:var(--soft)}
.sez-n{font-family:'Atkinson Hyperlegible',sans-serif;font-size:.85rem;color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:1fr auto 2.4rem;align-items:center;gap:.6rem;padding:.45rem .8rem .45rem .9rem;border-bottom:1px solid #E8ECE6;border-left:5px solid transparent;transition:background .25s}
.row:last-child{border-bottom:0}
.row.done{border-left-color:var(--basil)}
.row.flash{background:var(--tom-s);border-left-color:var(--tom)}
.r-name{font-weight:700;line-height:1.25;min-width:0}
.r-name small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.u{font-size:.85rem;color:var(--muted);font-weight:700}
.stepper{display:flex;align-items:center}
.stepper button{width:50px;height:50px;border:1.5px solid var(--line);background:var(--bg);font-size:1.6rem;line-height:1;cursor:pointer;touch-action:manipulation}
.stepper button:first-child{border-radius:8px 0 0 8px}
.stepper button:last-child{border-radius:0 8px 8px 0}
.stepper input{width:4.2rem;height:50px;border:1.5px solid var(--line);border-left:0;border-right:0;border-radius:0;text-align:center;font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--card)}
.row.done .stepper input{background:var(--basil-s)}

.bar{position:sticky;bottom:0;z-index:5;margin:1.2rem -1rem 0;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.sez-foot{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.7rem 1rem;border-top:1px solid var(--line);background:var(--soft)}
.sez-foot:empty{display:none}
.sez.locked .stepper{opacity:.55}
.r-name .tip{display:block;font-size:.78rem;color:var(--muted);font-weight:400}
.row.anom{border-left-color:var(--amb);background:var(--amb-s)}
.row.anom .tip{color:var(--amb);font-weight:700}
.tbl td.hi{background:var(--amb-s);color:var(--amb);font-weight:700}
.prog{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:.6rem}
.prog i{display:block;height:100%;width:0;background:var(--basil);transition:width .3s}
.bar-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.bar-row .btn.primary{margin-left:auto}
#mancanti{font-weight:700;color:var(--tom)}#mancanti.okt{color:var(--basil)}

.sedi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}
.sede-card,.sede-btn{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;text-align:left;padding:1rem;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:10px;cursor:pointer}
.sede-card.ok{border-left-color:var(--basil)}.sede-card.wip{border-left-color:var(--amb)}.sede-card.todo{border-left-color:var(--tom)}
.sc-name,.sede-btn{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:600}
.sede-btn{min-height:90px;justify-content:center;border-left-color:var(--basil)}
.sc-info{font-size:.9rem;color:var(--muted)}
.pill{font-size:.8rem;font-weight:700;padding:.15rem .55rem;border-radius:4px}
.pill.ok{background:var(--basil-s);color:var(--basil-d)}.pill.wip{background:var(--amb-s);color:var(--amb)}.pill.todo{background:var(--tom-s);color:var(--tom)}

.h2{margin:1.4rem 0 .8rem}
.ordini{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem}
.ord{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;display:flex;flex-direction:column}
.ord header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.5rem}
.ord ul{list-style:none;margin:0 0 1rem;padding:0;flex:1}
.ord li{padding:.3rem 0;border-bottom:1px dashed #E3E8E1}
.ord li b{display:inline-block;min-width:4.4rem;margin-right:.4rem;font-variant-numeric:tabular-nums}
.ord-acts,.acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}
.note{padding:.7rem 1rem;border-radius:8px;margin:0 0 1rem}
.note.warn{background:var(--amb-s);color:#5E4405}
.det{margin-top:1.2rem;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.1rem 1rem}
.det summary{cursor:pointer;padding:.8rem 0;font-weight:700}

.tblw{overflow-x:auto;margin:0 0 1rem}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem;background:var(--card)}
.tbl th{text-align:left;font-size:.8rem;color:var(--muted);font-weight:700;padding:.5rem .6rem;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:.5rem .6rem;border-bottom:1px solid #E8ECE6}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.grp td{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:1.1rem;background:var(--soft)}
.tbl.click tbody tr{cursor:pointer}.tbl.click tbody tr:hover{background:var(--soft)}
.tbl tr.neg td:first-child{box-shadow:inset 4px 0 var(--tom)}.tbl tr.alto td:first-child{box-shadow:inset 4px 0 var(--amb)}
.tag{font-style:normal;font-size:.72rem;font-weight:700;padding:.1rem .4rem;border-radius:4px;margin-left:.4rem;white-space:nowrap}
.tag.red{background:var(--tom-s);color:var(--tom)}.tag.amb{background:var(--amb-s);color:var(--amb)}
.kpis{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.kpis div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .9rem}
.kpis b{font-size:1.4rem;margin-right:.3rem}
.kpis .red b{color:var(--tom)}.kpis .amb b{color:var(--amb)}

.chk{display:inline-flex;align-items:center;gap:.4rem;font-size:.95rem;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--basil)}
.crow{grid-template-columns:1fr auto auto}
.mm{display:flex;gap:.5rem}
@media(max-width:520px){.crow{grid-template-columns:1fr auto}.crow .chk{grid-column:2;grid-row:1}.crow .mm{grid-column:1/-1;justify-content:flex-end}}
.crow.off .r-name{opacity:.45}
.sc{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--muted)}
.sc input{width:4.6rem;min-height:44px;border:1.5px solid var(--line);border-radius:8px;text-align:center;font-size:1.1rem;font-weight:700;background:var(--card)}
.nm{color:var(--ink);text-decoration:none;text-align:left;font-weight:700}
.forn{list-style:none;padding:0;margin:0 0 1rem}
.forn li{display:flex;gap:.8rem;align-items:baseline;padding:.45rem 0;border-bottom:1px solid #E8ECE6}
.forn li span{flex:1;font-weight:700}
.uform{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}.uform input{flex:1 1 260px;width:auto}

.modal{position:fixed;inset:0;z-index:20;background:rgba(20,32,25,.45);display:flex;align-items:flex-end;justify-content:center;padding:1rem}
.sheet{background:var(--card);border-radius:12px;padding:1.3rem;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.sheet h2{margin-bottom:1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6rem + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:#fff;padding:.7rem 1.1rem;border-radius:8px;font-weight:700;max-width:90vw;text-align:center}
.toast.err{background:var(--tom)}.toast.ok{background:var(--basil-d)}
@media(min-width:700px){.modal{align-items:center}}
@media(max-width:420px){.stepper button{width:42px;height:46px}.stepper input{width:3.4rem;height:46px}.row{gap:.4rem}.brand span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

  'Pelati S.Felici':22.97, 'Pelati Solania':35.88, 'Tonno 385 gr Sanfelici':5.95, 'Acciughe 730 gr':13.42, 'Porcini':14.46,
  'Funghi':7.59, 'Friarielli':5.23, 'Capperi':11.70, 'Carciofi gambo':7.00, 'Crema di zucca':5.20, 'Crema tartufata':10.80,
  'Crema di pecorino':11.67, 'Piennolo':2.25, 'Olio EVO 500 ml':11.28, 'Soleggiati':8.30, 'Origano':16.95,
  'Cotto':100, 'Crudo Parma':138, 'Spianata':24, 'Pancetta':55,

  'Legna':16.15 /* Bernardo Legnami: bancale 40 cartoni faggio 561 € + trasporto 85 € = 646 € / 40 */};

const MIN_ORDINE = {'Sanfelici':300};
const eur = v => '€ ' + (Math.round(v*100)/100).toFixed(2).replace('.',',');
const prezzoDi = id => { const a = S.articoli.find(x => x.id === id); return a && Number(a.prezzo) > 0 ? Number(a.prezzo) : 0; };
function num(v){ if(v===''||v==null) return null; const n = parseFloat(String(v).replace(',','.')); return isNaN(n)||n<0 ? null : n; }
const fmtN = n => n==null ? '' : String(n).replace('.',',');
const avg = a => a.reduce((x,y)=>x+y,0)/a.length;
function groupBy(arr,key){ const m = new Map(); arr.forEach(x => { const k = typeof key==='function' ? key(x) : x[key]; if(!m.has(k)) m.set(k,[]); m.get(k).push(x); }); return m; }
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
/* Giorni delle liste: domenica (0) e giovedì (4). Sanfelici solo la domenica (ordine poi girato martedì/mercoledì). */
const GIORNI_LISTA = [0,4];
const GIORNI_FORNITORE = {'Sanfelici':[0], 'Sammarco':[0], 'Artioli':[0], 'Bernardo Legnami':[0]};
/* Giacenza alcolici: se attiva dal titolare, queste sezioni si contano (min/max) invece dell'ordine diretto */
const SEZ_ALCOLICI = ['Vini bianchi','Vini rossi','Bollicine','Amari e distillati'];
/* Sezioni in uso per sede (se una sede non è elencata le usa tutte) */
const SEZ_SOLO = {'senzaglutine': ['Verdure','Pulizie','Salumi e formaggi','Bibite','Varie','Stracci']};
const sezInSede = (sez,sede) => !SEZ_SOLO[sede] || SEZ_SOLO[sede].includes(sez);
/* Magazzino Sanfelici della 3.0: sta fisicamente alla 2.0, lo conta il tablet della 2.0 come terzo reparto ("mag30"),
   con minimi e massimi della 3.0 e ordine separato (fatturato a Viale Group). La Farina Lucia è comune: si conta solo alla 2.0
   e la fattura si alterna tra 2.0 e 3.0. */
const MAG30 = {id:'mag30', nome:'Magazzino Sanfelici 3.0', sedeOspite:'gramsci', sedeScorte:'amendola', sezione:'Sanfelici', comuni:['Farina Lucia']};
/* Fuerte: una sola lista con tutto (cucina, bar, vini), così Mammafiore arriva in un unico ordine */
const repartiDi = sede => soloGiac(sede) ? [{id:'pizzeria', nome:'Giacenza completa'}] : sede === MAG30.sedeOspite ? [...REPARTI, {id:MAG30.id, nome:MAG30.nome}] : REPARTI;
const sedeScorte = c => c.reparto === MAG30.id ? MAG30.sedeScorte : c.sede;
const FATT = {gramsci:'TEPE (2.0)', amendola:'Viale Group (3.0)'};
function artsPer(sede, rep, data){
  if(rep === MAG30.id) return S.articoli.filter(a => a.sezione === MAG30.sezione && !MAG30.comuni.includes(a.nome) && attivo(a, MAG30.sedeScorte) && inGiorno(a,data));
  return S.articoli.filter(a => attivo(a,sede) && (soloGiac(sede) ? rep === 'pizzeria' : repDi(a)===rep) && inGiorno(a,data) && !(sede === MAG30.sedeScorte && a.sezione === MAG30.sezione));
}
const rigaTxt = r => `- ${qtaTxt(r).replace(/ \((.*)\)$/, '')} ${r.nome}${/\(/.test(qtaTxt(r)) ? ' ' + qtaTxt(r).match(/\(.*\)$/)[0] : ''}${r.fattura ? ` (fattura ${FATT[r.fattura]})` : ''}`;
/* liste con la pizzeria "vera": quelle del magazzino 3.0 contano per la 3.0 */
async function caricaListe(sede){
  const q = (sede === 'tutte' || sede === MAG30.sedeScorte || sede === MAG30.sedeOspite) ? db.collection('conteggi') : db.collection('conteggi').where('sede','==',sede);
  const qs = await q.get();
  return qs.docs.map(d => d.data()).map(d => d.reparto === MAG30.id ? {...d, sede: MAG30.sedeScorte} : d).filter(d => sede === 'tutte' || d.sede === sede);
}
/* Fornitori alternativi: per questi articoli, in 2.0 e 3.0, scegli tu a chi mandare l'ordine */
const ALT_FORN = {'Pancetta al pepe':['Villani'], 'Ventricina':['Villani'], 'Capocollo Martina Franca':['Villani']};
const ALT_SEDI = ['gramsci','amendola'];
const altDi = (r,c) => { const art = S.articoli.find(x => x.id === r.id);
  const alt = art && art.sedeSola && (art.alt||[]).length ? art.alt : (ALT_FORN[r.nome] && ALT_SEDI.includes(c.sede) ? ALT_FORN[r.nome] : null);
  if(!alt) return []; const base = r.fornOrig || r.fornitore; return [base, ...alt].filter((f,i,arr) => f !== r.fornitore && arr.indexOf(f) === i); };
const isDir = a => !!a.diretto && !((S.impostazioni||{}).giacenzaAlcolici && SEZ_ALCOLICI.includes(a.sezione));
/* Fornitori a consegna programmata (non ogni settimana): compaiono solo nella lista che precede la prossima consegna, impostata dal titolare */
const FORNITORI_PROGRAMMATI = ['Sal De Riso'];
/* Le liste si possono fare in qualsiasi giorno. Dopo mezzanotte (fino alle 6) la lista vale ancora per il giorno prima. */
function oggiLista(){ const x = new Date(Date.now() - 6*3600*1000); x.setHours(12,0,0,0); return x; }
const addGiorni = (ds,n) => { const d = new Date(ds+'T12:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
/* Sal De Riso: compare nelle liste dei 7 giorni prima della consegna, finché non è stato ordinato */
const finestraProg = d => [addGiorni(d,-7), addGiorni(d,-1)];
const inGiorno = (a,data) => {
  const g = (a.sedeSola === 'fuerte' ? GIORNI_FUERTE : GIORNI_FORNITORE)[a.fornitore]; if(g && !g.includes(new Date(data+'T12:00:00').getDay())) return false;
  if(FORNITORI_PROGRAMMATI.includes(a.fornitore)){ const d = (S.consegne||{})[a.fornitore]; if(!d) return true; const [da,a2] = finestraProg(d); return data >= da && data <= a2 && !(S.progOrdinati||{})[a.fornitore]; }
  return true;
};
function ultimaLista(){ return oggiLista(); }
function lastSunday(){ const x = new Date(); x.setHours(12,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; }
const fmt = s => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };
const dayName = s => new Date(s+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long'});
const toDate = x => x && x.toDate ? x.toDate() : (x instanceof Date ? x : (typeof x === 'string' ? new Date(x) : null));

let tT;
function toast(msg,kind){ const t=$('#toast'); t.textContent=msg; t.className='toast '+(kind||''); t.hidden=false; clearTimeout(tT); tT=setTimeout(()=>t.hidden=true,3500); }
function modal(html,bind){ const m=$('#modal'); m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; m.hidden=false; m.onclick=e=>{ if(e.target===m || e.target.closest('[data-close]')) closeModal(); }; bind && bind(m); }
/* Conferme dentro la pagina: le finestre del browser (confirm/prompt) sono bloccate in alcune app e anteprime */
function ask(msg, conInput, valore){
  return new Promise(res => {
    let fatto = false; const fine = v => { if(fatto) return; fatto = true; closeModal(); res(v); };
    modal(`<p style="white-space:pre-line;margin:0 0 1rem;font-size:1.05rem">${esc(msg)}</p>
      ${conInput ? `<input id="askv" class="search" value="${esc(valore||'')}" autocomplete="off" style="margin-bottom:1rem">` : ''}
      <div class="acts"><span class="sp"></span><button class="btn" id="askno">Annulla</button><button class="btn primary" id="asksi">${conInput?'Salva':'Conferma'}</button></div>`, m => {
      m.onclick = e => { if(e.target === m) fine(conInput ? null : false); };
      m.querySelector('#askno').onclick = () => fine(conInput ? null : false);
      m.querySelector('#asksi').onclick = () => fine(conInput ? m.querySelector('#askv').value : true);
      const i = m.querySelector('#askv'); if(i) i.focus();
    });
  });
}
const askText = (msg, valore) => ask(msg, true, valore);
function closeModal(){ const m=$('#modal'); m.hidden=true; m.innerHTML=''; }

let unsubArt=null, primo=true;
async function onAuth(u){
  if(unsubArt){ unsubArt(); unsubArt=null; }
  if(!u){ renderLogin(); return; }
  S.email = (u.email||'').toLowerCase();
  S.admin = ADMIN_EMAILS.map(e=>e.toLowerCase()).includes(S.email);
  app.innerHTML = '<p class="loading" style="text-align:center">Caricamento…</p>';
  if(!S.admin){
    try{ const d = await db.collection('utenti').doc(S.email).get(); S.sede = d.exists ? d.data().sede : null; }catch(e){ S.sede=null; }
    if(!S.sede){
      app.innerHTML = `<div class="login"><h1>Tablet non abbinato</h1><p>L'account ${esc(S.email)} non è collegato a nessuna pizzeria. L'amministratore deve abbinarlo nella sezione Tablet.</p><button class="btn" id="lo">Esci</button></div>`;
      $('#lo').onclick = () => auth.signOut(); return;
    }
  }
  try{ const cf = await db.collection('config').doc('consegne').get(); S.consegne = cf.exists ? cf.data() : {}; }catch(e){ S.consegne = {}; }
  try{ const im = await db.collection('config').doc('impostazioni').get(); S.impostazioni = im.exists ? im.data() : {}; }catch(e){ S.impostazioni = {}; }
  primo = true; let tentativi = 0;
  const ascolta = () => { unsubArt = db.collection('articoli').onSnapshot(qs => {
    S.articoli = qs.docs.map(d => ({id:d.id, ...d.data()})).sort(sortArt);
    if(primo){ primo=false; shell(); route(); }
    else if(S.view==='catalogo' && !Object.keys(S.catPending).length) renderCatalogo(true);
  }, async err => {
    /* Problema noto con più schede aperte: riprova da solo prima di mostrare l'errore */
    if(tentativi++ < 3){ try{ await auth.currentUser.getIdToken(true); }catch(e){} setTimeout(ascolta, 1500); return; }
    app.innerHTML = `<div class="login"><h1>Errore di accesso</h1><p>${esc(err.message)}</p><p>Chiudi le altre schede dell'app e riprova.</p><button class="btn primary big" onclick="location.reload()">Riprova</button><button class="link" style="margin-top:1rem" onclick="auth.signOut()">Esci</button></div>`;
  }); };
  ascolta();
}

async function route(){
  if(S.admin){ go(S.tab); return; }
  const oggi = ymd(oggiLista()); let data = oggi;
  try{ const qs = await db.collection('conteggi').where('sede','==',S.sede).get();
    const aperte = qs.docs.map(d=>d.data()).filter(d => d.stato !== 'chiuso' && d.data < oggi && d.data >= addGiorni(oggi,-7)
      /* blocca solo se la lista vecchia contiene davvero qualcosa: aperta per sbaglio o solo col nome non conta */
      && Object.values(d.righe||{}).some(v => typeof v === 'number' && v > 0)).sort((a,b)=>b.data.localeCompare(a.data));
    S.bloccoRep = {}; aperte.forEach(d => { if(!S.bloccoRep[d.reparto]) S.bloccoRep[d.reparto] = d.data; }); }catch(e){ S.bloccoRep = {}; }
  openSede(S.sede, data);
}
async function go(tab){
  if(S.view==='catalogo' && Object.keys(S.catPending).length && tab!=='catalogo'){
    if(!await ask('Ci sono modifiche alle scorte non salvate. Uscire senza salvare?')) return;
    S.catPending = {};
  }
  S.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===tab));
  ({settimana:renderSettimana, ordini:renderOrdini, magazzino:renderMagazzino, conta:renderContaScelta, storico:renderStorico, analisi:renderAnalisi, catalogo:()=>renderCatalogo(), utenti:renderUtenti})[tab]();
}

/* pizzeria su cui sta lavorando l'amministratore: resta la stessa passando da una scheda all'altra */
function sedeAttiva(){ if(!S.sedeAttiva){ try{ S.sedeAttiva = localStorage.getItem('lo-sede') || ''; }catch(e){} }
  return SEDI.some(s => s.id === S.sedeAttiva) ? S.sedeAttiva : SEDI[0].id; }
function setSedeAttiva(id){ S.sedeAttiva = id; try{ localStorage.setItem('lo-sede', id); }catch(e){} }
async function openSede(sede,data){
  if(S.admin) setSedeAttiva(sede);
  view('sede','<p class="loading">Caricamento…</p>');
  let snaps;
  let REPS = repartiDi(sede).filter(r => r.id !== MAG30.id || artsPer(sede, r.id, data).length);
  /* Fuerte: le vecchie liste "Bar e sala" fatte prima della lista unica restano apribili */
  if(soloGiac(sede)) REPS = [...REPS, {id:'sala', nome:'Bar e sala (lista separata)'}];
  try{ snaps = await Promise.all(REPS.map(r => db.collection('conteggi').doc(`${sede}_${data}_${r.id}`).get())); }
  catch(e){ main().innerHTML = `<p class="loading">Impossibile leggere le giacenze (${esc(e.message)}). Controlla la connessione e riprova.</p>`; return; }
  if(soloGiac(sede) && !snaps[snaps.length-1].exists){ REPS = REPS.slice(0,-1); snaps = snaps.slice(0,-1); }
  if(S.view!=='sede') return;
  const blocco = r => !S.admin && data === ymd(oggiLista()) && (S.bloccoRep||{})[r] && !(snaps[REPS.findIndex(x=>x.id===r)]||{}).exists ? S.bloccoRep[r] : null;
  const blocchi = REPS.map(r => [r.id, blocco(r.id)]).filter(x => x[1]);
  /* lista vecchia ancora aperta ma quella di oggi già iniziata: non blocca, ma si deve poter aprire per finirla */
  const vecchie = !S.admin && data === ymd(oggiLista()) ? REPS.filter(r => (S.bloccoRep||{})[r.id] && !blocco(r.id)).map(r => [r.id, S.bloccoRep[r.id]]) : [];
  view('sede', `${S.admin?'<button class="link back" data-back>Indietro</button>':''}
    <h1>${esc(sedeNome(sede))}</h1><p class="muted">Lista di ${dayName(data)} ${fmt(data)}. Scegli il reparto.</p>
    ${blocchi.length ? `<p class="note" style="background:var(--tom-s);color:var(--tom);font-weight:700">${blocchi.map(([r,d]) => `${repNome(r)}: c'è ancora la lista di ${dayName(d)} ${fmt(d)} da chiudere e inviare. Non puoi fare la lista nuova finché non la chiudi (se non c'è niente da ordinare, chiudila vuota).`).join('<br>')}</p>` : ''}
    ${vecchie.map(([r,d]) => `<p class="note" style="background:var(--tom-s);color:var(--tom);font-weight:700">${repNome(r)}: c'è ancora la lista di ${dayName(d)} ${fmt(d)} da finire e chiudere. <button class="btn" data-apri="${d}" style="margin-left:.5rem">Apri la lista di ${dayName(d)}</button></p>`).join('')}
    ${!S.admin && data !== ymd(oggiLista()) ? `<p class="note">Stai guardando la lista di ${dayName(data)} ${fmt(data)}. <button class="link" data-apri="${ymd(oggiLista())}">Torna alla lista di oggi</button></p>` : ''}
    <div class="sedi-grid" style="margin-top:1rem">${REPS.map((r,i) => { const st = statoConta(snaps[i], sede, r.id, data, i < 2 ? snaps[1-i] : null);
      const bd = blocco(r.id); if(bd){ st.stato = 'Prima chiudi la vecchia'; st.cls = 'wip'; st.info = `Tocca per aprire la lista di ${dayName(bd)} e chiuderla`; }
      return `<button class="sede-card ${st.cls}" data-r="${r.id}" style="min-height:130px"><span class="sc-name">${r.nome}</span><span class="pill ${st.cls}">${st.stato}</span><span class="sc-info">${st.info}</span></button>`; }).join('')}</div>`);
  main().onclick = e => { const o = e.target.closest('[data-apri]'); if(o){ openSede(sede, o.dataset.apri); return; }
    const b = e.target.closest('[data-r]'); if(!b) return; const d = blocco(b.dataset.r);
    if(d){ toast(`Prima chiudi e invia la lista di ${dayName(d)} ${fmt(d)}`,'err'); openConta(sede, d, b.dataset.r); return; }
    openConta(sede, data, b.dataset.r); };
}
function statoConta(sn, sede, rep, data, altroSn){
  const gArts = artsPer(sede, rep, data).filter(a => !isDir(a));
  if(!sn.exists) return {stato:'Da fare', cls:'todo', info: gArts.length ? `${gArts.length} articoli da contare` : soloGiac(sede) ? 'Oggi niente da contare' : 'Solo ordini, niente da contare'};
  const c = sn.data();
  if(c.stato==='chiuso'){ const a = altroSn && altroSn.exists ? altroSn.data() : null, m = fornitoriDaInviare(c, a), w = fornitoriInAttesa(c, a);
    const an = repNome((REPARTI.find(r => r.id !== rep) || REPARTI[0]).id);
    return {stato: m.length ? 'Chiusa, ordini non inviati' : 'Chiusa', cls: m.length ? 'wip' : 'ok', info: soloGiac(sede) ? `${esc(c.operatore||'')}, giacenza salvata (${(c.dettaglio||[]).filter(r => typeof r.g === 'number').length} articoli)` : `${esc(c.operatore||'')}, ${(c.dettaglio||[]).filter(r=>r.ordine>0).length} articoli da ordinare${m.length ? ` · non inviati: ${m.map(esc).join(', ')}` : ''}${w.length ? ` · ${w.map(esc).join(', ')} lo manda ${an}` : ''}`}; }
  return {stato:'In corso', cls:'wip', info: gArts.length ? `${gArts.filter(a => typeof (c.righe||{})[a.id]==='number').length} di ${gArts.length} contati` : 'Ordini in compilazione'};
}

/* Quantità abituali: media degli ordini (quando ordinato) nelle ultime 8 liste chiuse dello stesso reparto */
async function caricaAbituali(sede, rep, data){
  S.abituali = {};
  try{
    const qs = await db.collection('conteggi').where('sede','==',sede).get();
    const liste = qs.docs.map(d=>d.data()).filter(d => d.stato==='chiuso' && d.reparto===rep && d.data < data && d.dettaglio).sort((a,b)=>b.data.localeCompare(a.data)).slice(0,8);
    const acc = {};
    liste.forEach(l => l.dettaglio.forEach(r => { if(r.ordine > 0){ (acc[r.id] = acc[r.id] || []).push(r.ordine); } }));
    Object.entries(acc).forEach(([id,v]) => { if(v.length >= 2) S.abituali[id] = r1(avg(v)); });
  }catch(e){}
}
const sogliaInsolita = t => Math.max(t*2, t+2);
const insolito = (a,v) => isDir(a) && typeof v === 'number' && S.abituali && S.abituali[a.id] > 0 && v > sogliaInsolita(S.abituali[a.id]);

async function caricaProgOrdinati(sede, data, escludiId){
  S.progOrdinati = {};
  try{
    const qs = await db.collection('conteggi').where('sede','==',sede).get();
    FORNITORI_PROGRAMMATI.forEach(f => { const d = (S.consegne||{})[f]; if(!d) return; const [da,a2] = finestraProg(d);
      S.progOrdinati[f] = qs.docs.some(x => { const c = x.data(); return x.id !== escludiId && c.stato==='chiuso' && c.data >= da && c.data <= a2 && (c.dettaglio||[]).some(r => r.fornitore===f && typeof r.g==='number'); }); });
  }catch(e){}
}

/* admin: dalla lista di un reparto passi direttamente all'altro reparto della stessa pizzeria e dello stesso giorno */

document.addEventListener('click', async e => { const b = e.target.closest && e.target.closest('[data-vai]'); if(!b || !S.conta) return;

async function openConta(sede,data,rep){
  if(S.admin) setSedeAttiva(sede);
  view('conta','<p class="loading">Caricamento…</p>');
  const id = `${sede}_${data}_${rep}`; let snap;
  try{ snap = await db.collection('conteggi').doc(id).get(); }
  catch(e){ main().innerHTML = `<p class="loading">Impossibile leggere la giacenza (${esc(e.message)}). Controlla la connessione e riprova.</p>`; return; }
  S.conta = snap.exists ? {id, ...snap.data()} : {id, sede, data, reparto:rep, stato:'bozza', operatore:'', righe:{}};
  S.conta.righe = S.conta.righe || {}; S.altro = null;
  if(S.conta.stato === 'chiuso' && rep !== MAG30.id){ const ar = REPARTI.find(r => r.id !== rep);
    try{ const sa = await db.collection('conteggi').doc(`${sede}_${data}_${ar.id}`).get(); if(sa.exists) S.altro = {id: sa.id, ...sa.data()}; }catch(e){} }

  S.conta.stato === 'chiuso' ? renderChiuso() : renderConta();
}

function rowHtml(a,v){
  const done = typeof v === 'number';
  const t = isDir(a) && S.abituali ? S.abituali[a.id] : 0, an = insolito(a,v);
  return `<div class="row${done?' done':''}${an?' anom':''}" data-id="${a.id}" data-n="${esc(a.nome.toLowerCase())}"${isDir(a)?' data-dir':''}>
    <div class="r-name">${esc(a.nome)}<small>${esc(fornLabel(a))}</small>${t ? `<span class="tip">${an?'Insolito: di solito':'Di solito'} ${fmtN(t)} ${esc(a.unita||'')}</span>` : ''}</div>
    <div class="stepper"><button type="button" data-act="-" aria-label="Meno">−</button><input inputmode="decimal" autocomplete="off" value="${done?fmtN(v):''}" aria-label="${isDir(a)?'Da ordinare':'Giacenza'} ${esc(a.nome)}"><button type="button" data-act="+" aria-label="Più">+</button></div>
    <span class="u">${esc(a.unita||'')}</span></div>`;
}

    const b = e.target.closest('button[data-act]'); if(!b) return;

  });

  $('.chips').onclick = e => { const b = e.target.closest('[data-go]'); if(b) $('#sez-'+b.dataset.go).scrollIntoView({behavior:'smooth',block:'start'}); };
  /* sezione che stai guardando: bordo scuro sulla sua etichetta (il verde vuol dire "sezione completa") */
  const segnaCorrente = () => { if(S.view !== 'conta' || !$('.chips')) return; const top = ($('.rail') ? $('.rail').getBoundingClientRect().bottom : 0) + 10;
    let cur = null; document.querySelectorAll('[id^="sez-"]').forEach(sec => { if(sec.getBoundingClientRect().top <= top + 40) cur = sec.id.slice(4); });
    if(cur === null) cur = '0'; document.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('cur', ch.dataset.go === cur));
    const a = $('#chip-'+cur); if(a && a.scrollIntoView) { const ch = $('.chips'), r = a.getBoundingClientRect(), rc = ch.getBoundingClientRect(); if(r.left < rc.left || r.right > rc.right) ch.scrollLeft += r.left - rc.left - 20; } };
  window.onscroll = segnaCorrente; segnaCorrente();
  $('#q').oninput = e => {
    const q = e.target.value.trim().toLowerCase();

    clearTimeout(saveT); saveT = null; try{ await db.collection('conteggi').doc(c.id).delete(); }catch(e){}

function footSezione(sec, completa, mancano, compilati){
  const c = S.conta, i = +sec.dataset.i, [s, list] = S.contaGroups[i], foot = $('#foot-'+i);
  const inv = c.inviati && c.inviati[s];
  sec.classList.toggle('locked', !!inv);
  sec.querySelectorAll('.stepper input, .stepper button').forEach(el => el.disabled = !!inv);
  const forn = [...new Set(list.map(a => a.fornitore || 'Senza fornitore'))].join(', ');
  const haDir = list.some(a => isDir(a) && c.righe[a.id] > 0);
  if(inv){ const t = new Date(inv); foot.innerHTML = `<span class="pill ok">Ordine ${esc(forn)} inviato alle ${t.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</span><button class="link" data-unlock="${i}">Modifica</button>`; }
  else foot.innerHTML = '';
  return false;
}

function righeOrdine(c, list){
  return list.map(a => { const base = {id:a.id, nome:a.nome, unita:a.unita||'', sezione:a.sezione||'', fornitore:a.fornitore||''};
    if(isDir(a)){ const q = c.righe[a.id]; return {...base, g:null, scorta:0, ordine: q > 0 ? q : 0, diretto:true}; }
    const g = typeof c.righe[a.id] === 'number' ? c.righe[a.id] : null, sc = scortaDi(a,sedeScorte(c)), mx = maxDi(a,sedeScorte(c));
    return {...base, g, scorta:sc, max:mx, ordine:calcOrdine(sc,g,a.unita,mx,Number(a.lotto)||0,Number(a.conf)||0)}; });
}

async function ordineAnticipato(i){
  const c = S.conta, [s, list] = S.contaGroups[i];
  const vuoti = list.filter(a => !isDir(a) && typeof c.righe[a.id] !== 'number');
  const ord = righeOrdine(c, list).filter(r => r.ordine > 0);
  const groups = [...groupBy(ord, r => r.fornitore || 'Senza fornitore')];
  const segna = () => { c.inviati[s] = new Date().toISOString(); updateCounts(); clearTimeout(saveT); saveBozza(); };

      <div class="ord-acts"><a class="btn primary" target="_blank" rel="noopener" data-wa="${j}" href="${waUrl(testoOrdine(c,f,l))}">Invia ordine ${esc(f)} a ${NOME_ORDINI}</a><button class="btn" data-cp="${j}">Copia testo</button></div></article>`).join('')
      : '<p class="empty">Niente sotto scorta: non c\'è niente da ordinare per questa sezione.</p>'}
    <p class="muted small">Dopo l'invio la sezione viene bloccata, così l'ordine non cambia. Alla chiusura della giacenza questo ordine risulterà già inviato.</p>
    <div class="acts"><span class="sp"></span><button class="btn" data-close>Annulla</button>${groups.length?'':'<button class="btn primary" id="segna">Ok, sezione fatta</button>'}</div>`, m => {

    const sg = m.querySelector('#segna'); if(sg) sg.onclick = () => { segna(); closeModal(); toast('Sezione segnata come fatta','ok'); };
  });

function setVal(row,v){
  const id = row.dataset.id;
  if(v == null) delete S.conta.righe[id]; else S.conta.righe[id] = v;
  row.classList.toggle('done', v != null); row.classList.remove('flash');
  const a = S.articoli.find(x => x.id === id), tip = row.querySelector('.tip');
  if(a && tip){ const an = insolito(a,v); row.classList.toggle('anom', an); tip.textContent = `${an?'Insolito: di solito':'Di solito'} ${fmtN(S.abituali[a.id])} ${a.unita||''}`; }
  updateCounts(); queueSave();
}

function updateCounts(){
  const c = S.conta; let tot=0, done=0; const pronti = [];
  document.querySelectorAll('#lista .sez').forEach(sec => {
    const rows = sec.querySelectorAll('.row:not([data-dir])'); let d=0;
    rows.forEach(r => { if(typeof c.righe[r.dataset.id] === 'number') d++; });
    tot += rows.length; done += d;
    if(footSezione(sec, d === rows.length, rows.length - d, d)) pronti.push(+sec.dataset.i);
    const ch = $('#chip-'+sec.dataset.i);
    if(!rows.length){ const n = [...sec.querySelectorAll('.row[data-dir]')].filter(r => c.righe[r.dataset.id] > 0).length;
      sec.querySelector('.sez-n').textContent = `ordine diretto, ${n} righe`; ch.querySelector('b').textContent = 'ordine'; ch.classList.add('full'); return; }
    sec.querySelector('.sez-n').textContent = `${d}/${rows.length}`;
    ch.querySelector('b').textContent = `${d}/${rows.length}`; ch.classList.toggle('full', d===rows.length);
  });
  const miss = tot-done, m = $('#mancanti');
  $('#pf').style.width = (tot ? done/tot*100 : 0) + '%';
  m.textContent = !tot ? 'Solo ordini: scrivi quello che serve' : `Giacenza: ${done} di ${tot} inseriti`; m.className = 'okt';
  const pr = $('#pronti');
  if(pr) pr.innerHTML = miss && !INOLTRO_DIRETTO ? pronti.filter(i => S.contaGroups[i][1].some(a => !isDir(a))).map(i => { const forn = [...new Set(S.contaGroups[i][1].map(a => a.fornitore || 'Senza fornitore'))].join(', ');
    return `<button class="btn primary" data-anticipo="${i}">Invia ordine ${esc(forn)}</button>`; }).join('') : '';
}

let saveT=null;
function queueSave(){ const el=$('#saved'); if(el) el.textContent='Modifiche in attesa'; clearTimeout(saveT); saveT=setTimeout(saveBozza,1000); }
function saveBozza(){
  saveT = null;
  const c = S.conta; if(!c || c.stato==='chiuso') return Promise.resolve();
  c.creato = c.creato || new Date();
  const el = $('#saved'); if(el) el.textContent = 'Salvataggio…';
  const p = db.collection('conteggi').doc(c.id).set({sede:c.sede, data:c.data, reparto:c.reparto, stato:'bozza', operatore:c.operatore||'', righe:c.righe, inviati:c.inviati||{}, creato:c.creato, aggiornato:FV.serverTimestamp()});
  p.then(()=>{ const el=$('#saved'); if(el && S.conta===c) el.textContent='Salvato'; })
   .catch(e => toast('Salvataggio non riuscito: '+e.message,'err'));
  return p;
}
document.addEventListener('visibilitychange', () => { if(document.hidden && saveT){ clearTimeout(saveT); saveBozza(); } });

async function chiudiConta(){
  const c = S.conta;
  if(!(c.operatore||'').trim()){ toast('Scrivi chi ha fatto il conteggio','err'); $('#oper').focus(); return; }
  const q = $('#q'); if(q.value){ q.value=''; q.dispatchEvent(new Event('input')); }
  const miss = [...document.querySelectorAll('#lista .row:not([data-dir])')].filter(r => typeof c.righe[r.dataset.id] !== 'number');
  /* Giacenza Sanfelici obbligatoria: l'ordine si calcola da lì */
  const OBBLIGATORI = ['Sanfelici','Sammarco','Artioli','Bernardo Legnami'];
  const missObb = miss.filter(r => { const a = S.contaArts.find(x => x.id === r.dataset.id); return a && OBBLIGATORI.includes(a.fornitore); });
  if(missObb.length){
    missObb.forEach(r => r.classList.add('flash'));
    missObb[0].scrollIntoView({behavior:'smooth',block:'center'});
    toast(`Giacenza ${[...new Set(missObb.map(r => (S.contaArts.find(x => x.id === r.dataset.id)||{}).fornitore))].join(' e ')} obbligatoria: mancano ${missObb.length} articoli. Se un articolo è finito scrivi 0.`,'err'); return;
  }
  const strani = S.contaArts.filter(a => insolito(a, c.righe[a.id]));
  if(strani.length && !await ask('Quantità insolite rispetto al solito:\n' + strani.map(a => `- ${a.nome}: ${fmtN(c.righe[a.id])} ${a.unita} (di solito ${fmtN(S.abituali[a.id])})`).join('\n') + '\n\nSono corrette?')){
    const r = document.querySelector(`#lista .row[data-id="${strani[0].id}"]`); if(r) r.scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(!await ask((miss.length ? `${miss.length} articoli non compilati: per questi non verrà fatto l'ordine.\n\n` : '') + 'Chiudere la lista e preparare gli ordini?\nDopo la chiusura la lista non si potrà più modificare.')) return;
  clearTimeout(saveT); saveT=null;
  const inv = c.inviati || {};
  /* minimi e massimi sempre aggiornati: rilegge il catalogo dal server prima di calcolare l'ordine */
  try{ const qs = await Promise.race([db.collection('articoli').get(DEMO ? undefined : {source:'server'}), new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),5000))]);
    const fresh = new Map(qs.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
    S.contaArts = S.contaArts.map(a => fresh.get(a.id) || a); }catch(e){}
  const dettaglio = righeOrdine(c, S.contaArts).map(r => inv[r.sezione] ? {...r, inviato:true} : r);
  /* Farina Lucia comune 2.0/3.0: la fattura si alterna rispetto all'ultimo ordine */
  if(c.sede === MAG30.sedeOspite && c.reparto !== MAG30.id){ const comuni = dettaglio.filter(r => MAG30.comuni.includes(r.nome) && r.ordine > 0);
    if(comuni.length){ let ultima = null;
      try{ const qs = await Promise.race([db.collection('conteggi').where('sede','==',c.sede).get(), new Promise((_,rj)=>setTimeout(()=>rj(),5000))]);
        qs.docs.map(d=>d.data()).filter(d => d.stato==='chiuso' && d.data < c.data && d.dettaglio).sort((x,y)=>y.data.localeCompare(x.data))
          .some(d => { const r = d.dettaglio.find(x => MAG30.comuni.includes(x.nome) && x.ordine > 0 && x.fattura); if(r){ ultima = r.fattura; return true; } return false; }); }catch(e){}
      comuni.forEach(r => r.fattura = ultima === 'gramsci' ? 'amendola' : 'gramsci'); } }
  const doc = {sede:c.sede, data:c.data, reparto:c.reparto, stato:'chiuso', operatore:c.operatore.trim(), righe:c.righe, inviati:inv, creato:c.creato||new Date(), chiuso:new Date(), dettaglio};
  if(S.bloccoRep && S.bloccoRep[c.reparto] === c.data) delete S.bloccoRep[c.reparto];
  const btn = $('#chiudi'); btn.disabled=true; btn.textContent='Chiusura…';
  let offline = false;
  try{ /* JSON toglie i campi vuoti (undefined) che Firestore rifiuta */
    const pulito = {...JSON.parse(JSON.stringify({...doc, creato:null, chiuso:null})), creato: doc.creato, chiuso: doc.chiuso};
    const write = db.collection('conteggi').doc(c.id).set(pulito);
    await Promise.race([write, new Promise(r=>setTimeout(()=>{offline=true;r();},5000))]); }
  catch(e){ toast('Chiusura non riuscita: '+e.message,'err'); btn.disabled=false; btn.textContent=INOLTRO_DIRETTO ? 'Chiudi lista' : 'Chiudi lista e invia ordini'; return; }
  S.conta = {id:c.id, ...doc}; S.altro = null;
  /* si apre WhatsApp con l'avviso per Luigi già scritto: basta premere Invia */
  if(!S.admin && !offline && (INOLTRO_DIRETTO || soloGiac(c.sede))) try{ window.open(waUrl(testoAvviso(S.conta)), '_blank'); }catch(e){}
  if(c.reparto !== MAG30.id) try{ const ar = REPARTI.find(r => r.id !== c.reparto); const sa = await Promise.race([db.collection('conteggi').doc(`${c.sede}_${c.data}_${ar.id}`).get(), new Promise((_,rj)=>setTimeout(()=>rj(),4000))]); if(sa.exists) S.altro = {id: sa.id, ...sa.data()}; }catch(e){}
  renderChiuso();
  toast(offline ? 'Lista chiusa. Verrà salvata appena torna la connessione.' : (INOLTRO_DIRETTO ? 'Lista chiusa: premi Invia su WhatsApp per avvisare ' + NOME_ORDINI : 'Lista chiusa: ora invia gli ordini'),'ok');
}

function testoOrdine(c,f,list){
  const sez = [...groupBy(list, r => r.sezione || 'Altro')];
  const testa = c.reparto === MAG30.id ? `*ORDINE ${f.toUpperCase()} – 3.0 AMENDOLA*\n${sedeNome(MAG30.sedeScorte)} (magazzino alla 2.0) – fattura ${FATT.amendola}` : `*ORDINE ${f.toUpperCase()} – ${repNome(c.reparto).toUpperCase()}*\n${sedeNome(c.sede)}`;
  return `${testa}\nLista di ${dayName(c.data)} ${fmt(c.data)}\n` + sez.map(([s,l]) => `\n*${(s === 'Sanfelici' && f !== 'Sanfelici' ? f : s).toUpperCase()}*\n` + l.map(rigaTxt).join('\n')).join('\n');
}

/* Metro: un solo messaggio per pizzeria, unendo Pizzeria e Bar e sala dello stesso giorno.
   Lo manda il reparto che chiude per ultimo; l'altro resta "in attesa" (con "Invia lo stesso" se l'altro reparto oggi non fa la lista). */
const FORN_UNICI = ['Metro'];
const altroDoc = c => { const a = S.altro; return a && a.sede === c.sede && a.data === c.data ? a : null; };
const inviatoF = (d,f) => (d.inviatiWa||{})[f] || (d.inoltrati||{})[f];
const righeF = (d,f) => (d.dettaglio||[]).filter(r => r.ordine > 0 && !r.inviato && (r.fornitore||'Senza fornitore') === f);
function inAttesa(c,f,a){
  if(!FORN_UNICI.includes(f) || !conStati(c) || inviatoF(c,f)) return false;
  if(!a || a.stato !== 'chiuso') return true;
  if(inviatoF(a,f)) return false;
  return (toDate(a.chiuso)||0) > (toDate(c.chiuso)||0);
}
function righeAltro(c,f,a = altroDoc(c)){
  if(!FORN_UNICI.includes(f) || !conStati(c) || !a || a.stato !== 'chiuso') return [];
  const ia = inviatoF(a,f), ic = inviatoF(c,f);
  if(ia && ia !== ic) return [];
  if(!S.admin && inAttesa(c,f,a)) return [];
  return righeF(a,f);
}

/* Le liste chiuse prima del 9/11 non hanno gli stati di invio: si considerano gestite */
const STATI_DAL = '2026-11-09';
const conStati = c => (c.data||'') >= STATI_DAL;
function fornitoriDaInviare(c, a = altroDoc(c)){
  if(!conStati(c) || soloGiac(c.sede)) return [];
  const forn = new Set((c.dettaglio||[]).filter(r => r.ordine > 0 && !r.inviato).map(r => r.fornitore || 'Senza fornitore'));
  FORN_UNICI.forEach(f => { if(a && a.stato === 'chiuso' && !inviatoF(a,f) && righeF(a,f).length && !inAttesa(c,f,a)) forn.add(f); });
  return [...forn].filter(f => !inviatoF(c,f) && !inAttesa(c,f,a));
}
const fornitoriInAttesa = (c, a = altroDoc(c)) => FORN_UNICI.filter(f => righeF(c,f).length && inAttesa(c,f,a));
async function segnaInviatoWa(f){
  const c = S.conta; if(!c || c.stato !== 'chiuso' || S.admin) return;
  const ora = new Date().toISOString(), conAltro = righeAltro(c,f).length > 0;
  c.inviatiWa = {...(c.inviatiWa||{}), [f]: ora};
  try{ await db.collection('conteggi').doc(c.id).update({inviatiWa: c.inviatiWa}); }catch(e){}
  if(conAltro){ S.altro.inviatiWa = {...(S.altro.inviatiWa||{}), [f]: ora}; try{ await db.collection('conteggi').doc(S.altro.id).update({inviatiWa: S.altro.inviatiWa}); }catch(e){} }
  if(S.view === 'conta') setTimeout(() => { if(S.conta === c) renderChiuso(); }, 800);
}

        if(S.conta === c) renderChiuso(); };
      if(navigator.share){ try{ await navigator.share({text: t}); await segnaInoltro(); return; }catch(err){ if(err && err.name === 'AbortError') return; } }
      await segnaInoltro(); location.href = 'https://wa.me/?text=' + encodeURIComponent(t); return; }
    const b = e.target.closest('[data-copy]'); if(!b) return;
    const [f,list] = groups[+b.dataset.copy];
    navigator.clipboard.writeText(testoFornitore(c,f,list)).then(()=>toast('Testo copiato','ok'),()=>toast('Copia non riuscita','err')); };
  if(S.admin){
    $('#csv').onclick = () => exportCSV(c);
    $('#riapri').onclick = async () => { if(!await ask('Riaprire la lista? Il tablet potrà modificarla di nuovo.')) return;
      await db.collection('conteggi').doc(c.id).update({stato:'bozza', dettaglio:FV.delete(), chiuso:FV.delete(), inviatiWa:FV.delete(), inoltrati:FV.delete()}); openConta(c.sede,c.data,c.reparto); };
    $('#elim').onclick = async () => { if(!await ask('Eliminare definitivamente questa lista?')) return;
      await db.collection('conteggi').doc(c.id).delete(); toast('Lista eliminata','ok'); openSede(c.sede,c.data); };
  }
}

/* ============ FUERTE (solo giacenze): l'ordine lo componi tu ============
   Una sola tabella "Ordini": per ogni articolo scegli dalla tendina quantità e fornitore, poi inoltri fornitore per fornitore. */
/* fornitore già scelto nella tendina: Mammafiore, tranne questi che di solito prendi da Comit (si può sempre cambiare) */
const DEFAULT_COMIT = ['Cotto','Mozzarella','Torta al pistacchio','Bufala','Burrata','Funghi champignon','Crema di zucca','Pesto di pistacchio','Granella di pistacchio'];
const fornScelto = r => { const art = S.articoli.find(x => x.id === r.id); const alt = art && (art.alt||[]).length;
  return alt ? (r.fornScelto || (DEFAULT_COMIT.includes(r.nome) ? 'Comit' : art.fornitore) || '') : (r.fornitore || ''); };
const fornOpzioni = r => { const art = S.articoli.find(x => x.id === r.id); return art && (art.alt||[]).length ? [art.fornitore, ...art.alt] : [r.fornitore]; };
function renderChiusoSoloGiac(c){
  S.tieniScroll = S.view === 'conta' && S.ultimoChiuso === c.id; S.ultimoChiuso = c.id;
  const det = c.dettaglio || [], cd = toDate(c.chiuso);
  const contati = det.filter(r => typeof r.g === 'number');
  const inOrdine = det.filter(r => r.inOrdine || (typeof r.g === 'number' && (r.ordine > 0 || isMano(r.id))));
  const altri = det.filter(r => !inOrdine.includes(r));
  const gTxt = r => typeof r.g === 'number' ? fmtN(r.g) + ' ' + (r.unita||'') : 'non contato';
  const qtaOpts = r => { const vals = new Set([...Array(31).keys()]); if(isFraz(r.unita) || r.unita === 'Cassa') for(let v = 0.5; v < 10; v++) vals.add(v);
    const art = S.articoli.find(x => x.id === r.id), cf = art ? Number(art.conf) || 0 : 0; if(cf > 1) for(let k = 1; k <= 5; k++) vals.add(cf * k); if(r.ordine > 0) vals.add(r.ordine); return [...vals].sort((a,b)=>a-b); };
  const conForn = inOrdine.filter(r => r.ordine > 0 && fornScelto(r));
  const senzaForn = inOrdine.filter(r => r.ordine > 0 && !fornScelto(r));
  const perF = [...groupBy(conForn, r => fornScelto(r))].sort((a,b)=>a[0].localeCompare(b[0]));
  view('conta', `<button class="link back" data-sedeback>Cambia reparto</button>${repSwitch(S.conta)}
  <div class="conta-head"><div><h1>${esc(sedeNome(c.sede))}, ${repNome(c.reparto)}</h1>
    <p class="muted">Lista di ${dayName(c.data)} ${fmt(c.data)}, chiusa da ${esc(c.operatore)}${cd?` il ${cd.toLocaleDateString('it-IT')} alle ${cd.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}`:''}</p></div>
    <div class="acts"><button class="btn" id="csv">Esporta CSV</button><button class="btn" id="riapri">Riapri</button><button class="btn danger" id="elim">Elimina</button></div></div>
  <h2 class="h2">Ordini</h2>
  <p class="small muted">Le quantità proposte vengono da minimi e massimi; i freschi li decidi tu. Per ogni articolo scegli quantità e fornitore dalla tendina (0 = non ordinare).</p>
  <div class="tblw"><table class="tbl"><thead><tr><th>Articolo</th><th class="n">Giacenza</th><th class="n">Da ordinare</th><th>Fornitore</th></tr></thead><tbody>
  ${inOrdine.map(r => `<tr><td>${esc(r.nome)}${isMano(r.id) ? ' <small class="muted">fresco</small>' : ''}</td><td class="n">${esc(gTxt(r))}</td>
    <td class="n"><select class="sel" data-qta="${esc(r.id)}">${qtaOpts(r).map(v => `<option value="${v}"${v === (r.ordine||0) ? ' selected' : ''}>${v === 0 ? '—' : esc(qtaTxt({...r, ordine:v}))}</option>`).join('')}</select></td>
    <td>${fornOpzioni(r).length > 1 ? `<select class="sel" data-forn="${esc(r.id)}"><option value="">scegli…</option>${fornOpzioni(r).map(f => `<option value="${esc(f)}"${fornScelto(r) === f ? ' selected' : ''}>${esc(f)}${prezzoF(r,f) ? ' · ' + eur(prezzoF(r,f)) : ''}</option>`).join('')}</select>` : esc(r.fornitore||'')}</td></tr>`).join('')
    || '<tr><td colspan="4" class="muted">Niente sotto scorta.</td></tr>'}
  </tbody></table></div>
  ${altri.length ? `<p style="margin:.5rem 0"><select class="sel" id="aggiungi"><option value="">+ aggiungi un altro articolo all'ordine…</option>${altri.map(r => `<option value="${esc(r.id)}">${esc(r.nome)} (giacenza ${esc(gTxt(r))})</option>`).join('')}</select></p>` : ''}
  ${senzaForn.length ? `<p class="note warn">Scegli il fornitore per: ${senzaForn.map(r => esc(r.nome)).join(', ')}.</p>` : ''}
  <h2 class="h2">Invia ai fornitori</h2>
  ${perF.length ? `<div class="ordini">${perF.map(([f,list],i) => { const fw = (c.inoltrati||{})[f]; return `<article class="ord"${fw?' style="opacity:.8"':''}><header><h3>${esc(f)}</h3>${fw ? `<span class="pill ok">Mandato alle ${oraBreve(fw)}</span>` : '<span class="pill wip">Da inoltrare</span>'}</header>
    <ul>${list.map(r => `<li><b>${esc(qtaTxt(r))}</b>${esc(r.nome)}</li>`).join('')}</ul>
    ${(() => { const cp = list.filter(r => prezzoF(r,f) > 0); if(!cp.length) return ''; const tot = cp.reduce((t,r) => t + r.ordine * prezzoF(r,f), 0);
      return `<p class="small" style="margin:.4rem 0">Valore stimato <b>${eur(tot)}</b>${cp.length < list.length ? ` <span class="muted">(${list.length - cp.length} senza prezzo)</span>` : ''}</p>`; })()}
    <div class="ord-acts"><button class="btn primary" data-inv="${i}">${fw ? 'Inoltra di nuovo' : 'Inoltra a ' + esc(f)}</button><button class="btn" data-cp="${i}">Copia testo</button></div></article>`; }).join('')}</div>`
    : '<p class="empty">Ancora nessun ordine pronto: scegli quantità e fornitore qui sopra.</p>'}
  <details class="det"><summary>Giacenze contate (${det.length})</summary><div class="tblw"><table class="tbl">
    <thead><tr><th>Articolo</th><th class="n">Giacenza ${fmt(c.data)}</th><th class="n">Min</th><th class="n">Max</th></tr></thead>
    <tbody>${[...groupBy(det,'sezione')].map(([s,l])=>`<tr class="grp"><td colspan="4">${esc(s)}</td></tr>`+l.map(r=>`<tr><td>${esc(r.nome)}</td><td class="n">${typeof r.g==='number'?fmtN(r.g)+' '+esc(r.unita):'<span class="muted">non contato</span>'}</td><td class="n">${r.scorta>0?fmtN(r.scorta):'–'}</td><td class="n">${r.max>0?fmtN(r.max):'–'}</td></tr>`).join('')).join('')}</tbody></table></div></details>`);
  const salva = async () => { try{ await db.collection('conteggi').doc(c.id).update({dettaglio: JSON.parse(JSON.stringify(c.dettaglio))}); }catch(err){ toast('Errore: '+err.message,'err'); } renderChiusoSoloGiac(c); };
  const riga = id => (c.dettaglio||[]).find(x => x.id === id);
  main().querySelectorAll('[data-qta]').forEach(sel => sel.onchange = () => { const r = riga(sel.dataset.qta); if(!r) return; r.ordine = Number(sel.value) || 0; r.inOrdine = true; delete r.tolto; salva(); });
  main().querySelectorAll('[data-forn]').forEach(sel => sel.onchange = () => { const r = riga(sel.dataset.forn); if(!r) return; if(sel.value) r.fornScelto = sel.value; else delete r.fornScelto; salva(); });
  const ag = $('#aggiungi'); if(ag) ag.onchange = () => { const r = riga(ag.value); if(!r) return; r.inOrdine = true; salva(); };
  main().onclick = async e => {
    if(e.target.closest('[data-sedeback]')){ openSede(c.sede, c.data); return; }
    const iv = e.target.closest('[data-inv]'), cp = e.target.closest('[data-cp]'); if(!iv && !cp) return;
    const [f,list] = perF[+(iv||cp).dataset[iv ? 'inv' : 'cp']]; const t = testoFornitore(c,f,list);
    if(cp){ navigator.clipboard.writeText(t).then(()=>toast('Testo copiato','ok'),()=>toast('Copia non riuscita','err')); return; }
    const segna = async () => { c.inoltrati = {...(c.inoltrati||{}), [f]: new Date().toISOString()}; try{ await db.collection('conteggi').doc(c.id).update({inoltrati: c.inoltrati}); }catch(err){} if(S.conta === c) renderChiusoSoloGiac(c); };
    if(navigator.share){ try{ await navigator.share({text: t}); await segna(); return; }catch(err){ if(err && err.name === 'AbortError') return; } }
    await segna(); location.href = 'https://wa.me/?text=' + encodeURIComponent(t); };
  $('#csv').onclick = () => exportCSV(c);
  $('#riapri').onclick = async () => { if(!await ask('Riaprire la lista? Il tablet potrà modificarla di nuovo.')) return;
    await db.collection('conteggi').doc(c.id).update({stato:'bozza', dettaglio:FV.delete(), chiuso:FV.delete(), inviatiWa:FV.delete(), inoltrati:FV.delete()}); openConta(c.sede,c.data,c.reparto); };
  $('#elim').onclick = async () => { if(!await ask('Eliminare definitivamente questa lista?')) return;
    await db.collection('conteggi').doc(c.id).delete(); toast('Lista eliminata','ok'); openSede(c.sede,c.data); };
}

function exportCSV(c){
  const rows = [['Pizzeria','Reparto','Data','Sezione','Fornitore','Articolo','Unità','Giacenza','Minimo','Massimo','Ordine']]
    .concat((c.dettaglio||[]).map(r => [sedeNome(c.sede), repNome(c.reparto), fmt(c.data), r.sezione, r.fornitore, r.nome, r.unita, r.diretto?'ordine diretto':fmtN(r.g), r.scorta>0?fmtN(r.scorta):'', r.max>0?fmtN(r.max):'', r.ordine>0?fmtN(r.ordine):'']));
  const csv = '\ufeff' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = `giacenza_${c.sede}_${c.reparto}_${c.data}.csv`; document.body.appendChild(a); a.click(); a.remove();
}

/* ============ ADMIN: MAGAZZINO SANFELICI (come il foglio Excel) ============ */
const MAG_FORN = ['Sanfelici','Sammarco','Artioli','Bernardo Legnami'];
async function renderMagazzino(){
  const sede = sedeAttiva(), n = S.mgN || 8;
  view('magazzino', `<div class="vhead"><h1>Magazzino</h1><select id="ms" class="sel">${SEDI.map(s=>`<option value="${s.id}"${s.id===sede?' selected':''}>${esc(s.nome)}</option>`).join('')}</select>
    <select id="mn" class="sel">${[[4,'Ultime 4'],[8,'Ultime 8'],[13,'Ultime 13'],[999,'Tutte']].map(([v,t])=>`<option value="${v}"${v===n?' selected':''}>${t}</option>`).join('')}</select><button class="btn" id="mcsv">Esporta Excel</button></div>
    <p class="muted small">Giacenze di Sanfelici, Sammarco (liquori), Artioli (stracci) e Bernardo Legnami (legna), con quanto è stato ordinato. Min e max sono quelli attuali del catalogo.</p><div id="mb"><p class="loading">Caricamento…</p></div>`);
  $('#ms').onchange = e => { setSedeAttiva(e.target.value); renderMagazzino(); };
  $('#mn').onchange = e => { S.mgN = +e.target.value; renderMagazzino(); };
  let docs;
  try{ docs = await caricaListe(sede); }
  catch(e){ $('#mb').innerHTML = `<p class="loading">Errore: ${esc(e.message)}</p>`; return; }
  if(S.view!=='magazzino' || sedeAttiva()!==sede) return;
  const perData = {};
  docs.filter(d => d.stato==='chiuso' && d.dettaglio).forEach(d => d.dettaglio.forEach(r => {
    if(!(soloGiac(sede) || MAG_FORN.includes(r.fornitore) || r.sezione === 'Liquori') || r.diretto || typeof r.g !== 'number') return;
    (perData[d.data] = perData[d.data] || {})[r.id] = r; }));
  const date = Object.keys(perData).sort().slice(-n);
  if(!date.length){ $('#mb').innerHTML = '<p class="empty">Nessuna giacenza Sanfelici chiusa per questa pizzeria.</p>'; $('#mcsv').onclick = null; return; }
  const ids = [], nomi = {};
  S.articoli.filter(a => (soloGiac(sede) || MAG_FORN.includes(a.fornitore)) && !isDir(a) && attivo(a,sede)).forEach(a => { ids.push(a.id); nomi[a.id] = a; });
  date.forEach(d => Object.values(perData[d]).forEach(r => { if(!nomi[r.id]){ ids.push(r.id); nomi[r.id] = {nome:r.nome, unita:r.unita, sezione:r.sezione}; } }));
  const cella = v => v > 0 ? fmtN(v) : '–';
  /* valore in € (prezzi attuali del catalogo) */
  const valore = (d, k) => ids.reduce((t,id) => { const r = perData[d][id]; return t + (r && r[k] > 0 ? r[k] * prezzoDi(id) : 0); }, 0);
  const senzaPrezzo = ids.filter(id => !prezzoDi(id)).length;
  const sticky = 'position:sticky;left:0;background:var(--card,#fff);z-index:1';
  $('#mb').innerHTML = `<div class="tblw"><table class="tbl" style="white-space:nowrap">
    <thead><tr><th style="${sticky}">Articolo</th>${date.map(d=>`<th class="n">${dayName(d).slice(0,3)} ${fmt(d).slice(0,5)}<br><small>Giacenza</small></th><th class="n" style="color:var(--tom)"><br><small>Ordinato</small></th>`).join('')}<th class="n">Min</th><th class="n">Max</th><th>Unità</th></tr></thead>
    <tbody>${ids.map(id => { const a = nomi[id], ar = S.articoli.find(x=>x.id===id);
      return `<tr><td style="${sticky}">${esc(a.nome)}</td>${date.map(d => { const r = perData[d][id];
        return r ? `<td class="n">${fmtN(r.g)}</td><td class="n" style="color:var(--tom);font-weight:700">${cella(r.ordine)}</td>` : '<td class="n muted">·</td><td class="n muted">·</td>'; }).join('')}
        <td class="n">${ar && scortaDi(ar,sede) ? fmtN(scortaDi(ar,sede)) : '–'}</td><td class="n">${ar && maxDi(ar,sede) ? fmtN(maxDi(ar,sede)) : '–'}</td><td>${esc(a.unita||'')}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr style="font-weight:700;border-top:2px solid currentColor"><td style="${sticky}">Totale €</td>${date.map(d => `<td class="n">${eur(valore(d,'g'))}</td><td class="n" style="color:var(--tom)">${eur(valore(d,'ordine'))}</td>`).join('')}<td colspan="3"></td></tr></tfoot></table></div>
    <p class="muted small">Valori calcolati con i prezzi attuali del catalogo${senzaPrezzo ? `; ${senzaPrezzo} articoli senza prezzo non sono conteggiati` : ''}.</p>`;
  $('#mcsv').onclick = () => {
    const rows = [['Articolo', ...date.flatMap(d => ['Giacenza ' + fmt(d), 'Ordinato ' + fmt(d)]), 'Minimo', 'Massimo', 'Unità']]
      .concat(ids.map(id => { const a = nomi[id], ar = S.articoli.find(x=>x.id===id);
        return [a.nome, ...date.flatMap(d => { const r = perData[d][id]; return r ? [fmtN(r.g), r.ordine > 0 ? fmtN(r.ordine) : ''] : ['','']; }),
          ar && scortaDi(ar,sede) ? fmtN(scortaDi(ar,sede)) : '', ar && maxDi(ar,sede) ? fmtN(maxDi(ar,sede)) : '', a.unita||'']; }))
      .concat([['Totale €', ...date.flatMap(d => [fmtN(Math.round(valore(d,'g')*100)/100), fmtN(Math.round(valore(d,'ordine')*100)/100)]), '', '', '']]);
    const csv = '\ufeff' + rows.map(r => r.map(v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }).join(';')).join('\n');
    const x = document.createElement('a'); x.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    x.download = `magazzino_sanfelici_${sede}.csv`; document.body.appendChild(x); x.click(); x.remove(); };
}
